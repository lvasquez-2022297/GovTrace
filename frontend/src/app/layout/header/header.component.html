<header class="main-header">
  <div class="logo">
    <a [routerLink]="authService.isAuthenticated() ? '/dashboard' : '/home'" (click)="cerrarMenu()">
      <strong>GovTrace</strong>
    </a>
  </div>

  <button
    class="menu-toggle"
    type="button"
    aria-label="Abrir menú"
    [attr.aria-expanded]="menuAbierto"
    (click)="toggleMenu()"
  >
    ☰
  </button>

  <div class="header-collapse" [class.open]="menuAbierto">

    <ng-container *ngIf="authService.isAuthenticated(); else invitado">
      <nav class="nav-menu">
        <a routerLink="/dashboard" routerLinkActive="active" (click)="cerrarMenu()">Dashboard</a>
        <a routerLink="/licitaciones" routerLinkActive="active" (click)="cerrarMenu()">Licitaciones</a>
        <a routerLink="/adjudicaciones" routerLinkActive="active" (click)="cerrarMenu()">Adjudicaciones</a>
        <a routerLink="/proveedores" routerLinkActive="active" (click)="cerrarMenu()">Proveedores</a>
        <a routerLink="/alertas" routerLinkActive="active" (click)="cerrarMenu()">Alertas</a>
        <a *ngIf="puedeVerUsuarios" routerLink="/usuarios" routerLinkActive="active" (click)="cerrarMenu()">Usuarios</a>
      </nav>

      <div class="user-actions">
        <a routerLink="/perfil" class="user-link" *ngIf="usuario as u" (click)="cerrarMenu()">
          <div class="avatar">
            <span>{{ iniciales }}</span>
            <img *ngIf="u.foto_url" [src]="u.foto_url" alt="" (error)="$any($event.target).style.display = 'none'" />
          </div>
          <div class="user-info">
            <span class="user-name">{{ u.nombre }}</span>
            <span class="user-role">{{ u.rol }}</span>
          </div>
        </a>
        <button type="button" class="btn-logout" (click)="onLogout()">Cerrar Sesión</button>
      </div>
    </ng-container>

    <ng-template #invitado>
      <nav class="nav-menu"></nav>

      <div class="user-actions">
        <a routerLink="/login" class="btn-login" (click)="cerrarMenu()">Iniciar Sesión</a>
        <a routerLink="/register" class="btn-register" (click)="cerrarMenu()">Registrarse</a>
      </div>
    </ng-template>

  </div>
</header>
