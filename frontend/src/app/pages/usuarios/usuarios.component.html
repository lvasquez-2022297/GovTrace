<div class="usuarios-page">
  <header class="page-header">
    <h1>Gestión de Usuarios</h1>
    <p>Usuarios registrados en la plataforma GovTrace.</p>
  </header>

  <div class="toolbar">
    <input
      type="text"
      class="search-input"
      placeholder="Buscar por nombre o correo..."
      [(ngModel)]="busqueda"
    />

    <select class="role-select" [(ngModel)]="filtroRol">
      <option value="TODOS">Todos los roles</option>
      <option value="ADMIN">Administrador</option>
      <option value="AUDITOR">Auditor</option>
      <option value="CIUDADANO">Ciudadano</option>
    </select>
  </div>

  <p *ngIf="errorMensaje" class="error-banner">{{ errorMensaje }}</p>
  <p *ngIf="cargando" class="estado-carga">Cargando usuarios...</p>

  <div class="table-card" *ngIf="!cargando">
    <table class="usuarios-table">
      <thead>
        <tr>
          <th>NOMBRE</th>
          <th>CORREO</th>
          <th>ROL</th>
          <th>FECHA DE REGISTRO</th>
          <th *ngIf="esAdmin" class="text-right">ACCIONES</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuariosFiltrados">
          <td><strong>{{ usuario.nombre }}</strong></td>
          <td>{{ usuario.email }}</td>
          <td>
            <span
              class="badge"
              [ngClass]="{
                'badge-admin': usuario.rol === 'ADMIN',
                'badge-auditor': usuario.rol === 'AUDITOR',
                'badge-ciudadano': usuario.rol === 'CIUDADANO'
              }"
            >
              {{ usuario.rol }}
            </span>
          </td>
          <td>{{ usuario.creado_en | date:'dd/MM/yyyy' }}</td>
          <td *ngIf="esAdmin" class="text-right">
            <button
              class="btn-delete"
              [disabled]="usuario.id === miId"
              (click)="eliminar(usuario)"
            >
              Eliminar
            </button>
          </td>
        </tr>

        <tr *ngIf="usuariosFiltrados.length === 0">
          <td [attr.colspan]="esAdmin ? 5 : 4" class="sin-resultados">
            No se encontraron usuarios.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
