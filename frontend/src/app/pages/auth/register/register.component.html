<div class="register-container">
  <div class="register-card">
    <h2>Crear Cuenta - GovTrace</h2>
    <p class="subtitle">Registro de Nuevo Usuario</p>

    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input id="nombre" type="text" formControlName="nombre" placeholder="Juan Pérez" />
        <small *ngIf="registerForm.get('nombre')?.touched && registerForm.get('nombre')?.invalid" class="error-text">
          El nombre es requerido.
        </small>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="usuario@govtrace.gob" />
        <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="error-text">
          Ingresa un correo válido.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        <small *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="error-text">
          La contraseña debe tener al menos 6 caracteres.
        </small>
      </div>

      <div class="form-group">
        <label for="rol">Rol de Usuario</label>
        <select id="rol" formControlName="rol">
          <option value="CIUDADANO">Ciudadano</option>
          <option value="AUDITOR">Auditor</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || loading" class="btn-primary">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <div class="footer-links">
      <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
