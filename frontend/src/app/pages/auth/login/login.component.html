<div class="login-container">
  <div class="login-card">
    <h2>Iniciar Sesión - GovTrace</h2>
    <p class="subtitle">Plataforma de Monitoreo y Transparencia</p>

    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="ejemplo@govtrace.gob" 
        />
        <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error-text">
          Ingresa un correo electrónico válido.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••" 
        />
        <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-text">
          La contraseña es requerida (mínimo 6 caracteres).
        </small>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading" class="btn-primary">
        {{ loading ? 'Cargando...' : 'Ingresar' }}
      </button>
    </form>

    <div class="footer-links">
      <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
    </div>
  </div>
</div>
